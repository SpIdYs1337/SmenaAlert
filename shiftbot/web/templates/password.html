<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смена пароля · {{ panel_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css', v=panel_version) }}">
</head>
<body class="login-screen">
  <main class="login-panel">
    <div class="brand login-brand">{% include '_brand.html' %}</div>
    <h1>{{ 'Первый вход' if first else 'Смена пароля' }}</h1>
    {% if first %}<p>Задайте свой пароль для входа в панель.</p>{% endif %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if error %}<p class="error-box" role="alert">{{ error }}</p>{% endif %}
      <label>{{ 'Временный пароль' if first else 'Текущий пароль' }}<input type="password" name="password" required autocomplete="current-password"></label>
      <label>Новый пароль<input type="password" name="new_password" required minlength="12" maxlength="256" autocomplete="new-password"><small>От 12 символов</small></label>
      <label>Повторите новый пароль<input type="password" name="confirm_password" required autocomplete="new-password"></label>
      <button class="button primary">Сохранить пароль</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="button">Выйти</button></form>
  </main>
</body></html>
