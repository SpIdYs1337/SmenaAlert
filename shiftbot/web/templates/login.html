<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · {{ panel_name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='shift-mark.png', v=panel_version) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css', v=panel_version) }}">
</head>
<body class="login-screen">
  <main class="login-panel">
    <div class="brand login-brand">{% include '_brand.html' %}</div>
    <h1>Вход в панель</h1>
    <form class="stack" method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if error %}<p class="error-box" role="alert">{{ error }}</p>{% endif %}
      <label>Логин<input name="login" autocomplete="username" required autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary">Войти</button>
    </form>
  </main>
</body>
</html>
