services:
  monitor:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro
      - bot_data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
