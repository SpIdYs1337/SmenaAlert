services:
  panel:
    build: .
    entrypoint: ["python", "-m", "shiftbot.web"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--data-dir", "/app/data"]
    restart: unless-stopped
    init: true
    env_file: .env.web
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    volumes:
      - panel_data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  panel_data:
